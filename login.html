<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Secure Login System</h1>

            <h2>Login</h2>

            <p>{{ error }}</p>

            <form method="POST">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?

                <a href="/register">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</body>

</html>
